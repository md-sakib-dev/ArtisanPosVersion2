<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mini.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Never let the browser cache the app shell (index.html). It references
      the current fingerprinted bundle, so a cached copy keeps users on an
      old build until they hard-refresh. Fingerprinted files under /assets
      are still cached long-term by the server.
      Note: these meta tags are a hint — the authoritative fix is the
      `Cache-Control: no-cache` response header for index.html.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Wstech POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
